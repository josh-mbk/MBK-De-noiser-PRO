name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target MBKDenoiserPro_VST3 --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $vst = (Get-ChildItem -Path build -Recurse -Directory -Filter "MBK De-noiser PRO.vst3" | Select-Object -First 1).FullName
          Write-Host "VST3 trouve : $vst"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" "/DVstSource=$vst" installer\MBK_DenoiserPro.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build VST3
        run: cmake --build build --config Release --target MBKDenoiserPro_VST3 --parallel 4

      - name: Sign (ad-hoc) and package
        run: |
          VST="$(find build -type d -name 'MBK De-noiser PRO.vst3' | head -n 1)"
          echo "VST3 trouve : $VST"
          codesign --force --deep -s - "$VST"
          mkdir -p dist
          pkgbuild --component "$VST" \
                   --install-location "/Library/Audio/Plug-Ins/VST3" \
                   --identifier com.mbk.denoiserpro.vst3 \
                   --version "$VERSION" \
                   "dist/MBK-De-noiser-PRO-$VERSION-macOS.pkg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
